name: "Proposer un événement"
description: "Proposer un nouvel événement pour l'agenda de Lincé"
title: "[Événement] "
labels: ["événement"]
body:
  - type: markdown
    attributes:
      value: |
        Merci de proposer un événement pour l'agenda de Lincé !
        Remplissez les informations ci-dessous et nous l'ajouterons au site.
        
        Format utilisé dans les sources :
        `## AAAA-MM-JJ | Titre`
        puis des champs stricts comme `Lieu`, `Horaire`, `Catégorie`, `Date fin` et `Documents`.

  - type: input
    id: title
    attributes:
      label: Nom de l'événement
      placeholder: "ex: Brocante du village"
    validations:
      required: true

  - type: input
    id: date
    attributes:
      label: Date
      description: Format AAAA-MM-JJ
      placeholder: "2026-05-01"
    validations:
      required: true

  - type: input
    id: horaire
    attributes:
      label: Horaire
      description: "Format strict si renseigné : HH:MM - HH:MM"
      placeholder: "14:00 - 18:00"

  - type: input
    id: lieu
    attributes:
      label: Lieu
      placeholder: "Rue de l'Enseignement 5, 4140 Sprimont"
    validations:
      required: true

  - type: dropdown
    id: categorie
    attributes:
      label: Catégorie
      options:
        - fête
        - marché
        - sport
        - culture
        - autre

  - type: textarea
    id: description
    attributes:
      label: Description
      description: "Décrivez l'événement en quelques lignes"
      placeholder: "Grande brocante annuelle. Stands et restauration sur place."
    validations:
      required: true

  - type: textarea
    id: documents
    attributes:
      label: Documents ou liens
      description: "Utilisez de préférence des liens Markdown : [Affiche](https://example.com/affiche.jpg)"
      placeholder: |
        [Affiche](https://example.com/affiche.jpg), [Site web](https://example.com)

  - type: input
    id: source_file
    attributes:
      label: Fichier ou dossier conseillé
      description: "Optionnel : ex. comité-scolaire.md, village/2026.md"
      placeholder: "comite-scolaire.md"
