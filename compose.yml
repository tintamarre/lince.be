services:
  dev:
    build: .
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    ports:
      - "5173:5173"
    command: sh -c "pnpm install && pnpm dev --host"

  build:
    build: .
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    command: sh -c "pnpm install && pnpm build"

  ics:
    build: .
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    command: sh -c "pnpm install && pnpm ics"

volumes:
  node_modules:
